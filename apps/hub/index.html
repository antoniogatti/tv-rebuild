<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Hub</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a12; color: #fff;
               font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  #bg { position: absolute; inset: 0; background: radial-gradient(1200px 700px at 15% 10%, #3b2a8a 0%, transparent 60%),
        radial-gradient(1000px 700px at 90% 90%, #7a1f5c 0%, transparent 60%), linear-gradient(160deg, #0b1020, #070a12); }
  .photo { position: absolute; inset: 0; background: center / cover no-repeat; opacity: 0; transition: opacity 2s; }
  .photo.on { opacity: .8; }
  #shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(7,10,18,.55) 0%, rgba(7,10,18,.15) 35%, rgba(7,10,18,.85) 100%); }

  #top { position: absolute; top: 56px; left: 96px; right: 96px; display: flex; justify-content: space-between; align-items: flex-start; }
  #hello { font-size: 30px; color: #cbd5e1; }
  #hello b { color: #fff; font-weight: 600; }
  #clock { font-size: 120px; font-weight: 200; line-height: 1; letter-spacing: -2px; }
  #date { font-size: 28px; color: #cbd5e1; margin-top: 10px; text-transform: capitalize; text-align: right; }
  #right { text-align: right; }

  #rows { position: absolute; left: 0; right: 0; bottom: 70px; }
  .row { margin-bottom: 26px; }
  .row h2 { margin: 0 0 14px 96px; font-size: 24px; font-weight: 500; color: #94a3b8; letter-spacing: 3px; text-transform: uppercase; }
  .strip { display: flex; padding: 22px 96px; gap: 26px; transition: transform .25s ease; will-change: transform; }

  .tile { flex: 0 0 auto; width: 270px; height: 150px; border-radius: 22px; position: relative; display: flex; align-items: center;
          justify-content: center; flex-direction: column; overflow: hidden; border: 3px solid rgba(255,255,255,.12);
          transition: transform .18s ease, box-shadow .18s ease, border-color .18s; }
  .tile::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, rgba(255,255,255,.22), transparent 45%); }
  .tile .word { font-size: 38px; font-weight: 700; letter-spacing: .5px; text-shadow: 0 2px 10px rgba(0,0,0,.35); z-index: 1; }
  .tile svg { width: 64px; height: 64px; fill: #fff; z-index: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
  .tile .lbl { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; font-size: 20px; font-weight: 500;
               opacity: .9; z-index: 1; }
  .tile.has-glyph .lbl { opacity: 1; }
  .tile.has-icon { background: #101624 !important; }
  .tile.has-icon .word, .tile.has-icon svg, .tile.has-icon .lbl { display: none; }
  .tile.has-icon::after { display: none; }
  .tile .icon { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .tile.focus { transform: scale(1.14); border-color: #fff; box-shadow: 0 18px 50px rgba(0,0,0,.55), 0 0 0 6px rgba(255,255,255,.18); z-index: 2; }

  #msg { position: absolute; left: 96px; bottom: 24px; font-size: 22px; color: #fbbf24; }
</style>
</head>
<body>
<div id="bg"></div>
<div class="photo" id="p1"></div><div class="photo" id="p2"></div>
<div id="shade"></div>

<div id="top">
  <div id="hello"></div>
  <div id="right"><div id="clock"></div><div id="date"></div></div>
</div>
<div id="rows"></div>
<div id="msg"></div>

<script>
  var GLYPHS = {
    tv: '<path d="M4 6h24a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H18v2h6v2H8v-2h6v-2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm0 2v14h24V8z"/>',
    play: '<path d="M6 7a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v18a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3zM13 11v10l9-5z"/>',
    input: '<path d="M4 8h16v2H6v12h14v2H4zm18 4l8 4-8 4v-3h-9v-2h9z"/>',
    bt: '<path d="M15 3l9 8-6 5 6 5-9 8v-9l-5 4-1.5-1.5L14 16l-5.5-5.5L10 9l5 4zm2 5v5l3-2.5zm0 11v5l3-2.5z"/>',
    photo: '<path d="M4 6h24a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zm0 2v12l7-7 6 6 4-4 7 7V8zm17 3a2.5 2.5 0 1 0 .01 0z"/>'
  };

  var rows = [], pos = { r: 0, c: 0 }, cfg = null;

  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html) e.innerHTML = html; return e; }

  function tick() {
    var d = new Date();
    document.getElementById('clock').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
    document.getElementById('date').textContent = d.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
    var h = d.getHours(), g = h < 6 ? 'Buonanotte' : h < 13 ? 'Buongiorno' : h < 19 ? 'Buon pomeriggio' : 'Buonasera';
    document.getElementById('hello').innerHTML = g + (cfg && cfg.name ? ', <b>' + cfg.name + '</b>' : '');
  }

  function build() {
    var host = document.getElementById('rows');
    host.innerHTML = '';
    rows = [];
    cfg.rows.forEach(function (row) {
      var wrap = el('div', 'row');
      wrap.appendChild(el('h2', '', row.title));
      var strip = el('div', 'strip');
      var tiles = row.tiles.map(function (t) {
        var d = el('div', 'tile' + (t.glyph ? ' has-glyph' : ''));
        d.style.background = 'linear-gradient(135deg,' + t.colors[0] + ',' + t.colors[1] + ')';
        if (t.glyph) d.appendChild(el('div', '', '<svg viewBox="0 0 32 32">' + GLYPHS[t.glyph] + '</svg>'));
        else d.appendChild(el('div', 'word', t.text));
        if (t.glyph) d.appendChild(el('div', 'lbl', t.label));
        strip.appendChild(d);
        return { cfg: t, node: d };
      });
      wrap.appendChild(strip);
      host.appendChild(wrap);
      rows.push({ strip: strip, tiles: tiles });
    });
    focus();
  }

  function focus() {
    rows.forEach(function (r, ri) {
      r.tiles.forEach(function (t, ci) {
        t.node.className = t.node.className.replace(' focus', '') + (ri === pos.r && ci === pos.c ? ' focus' : '');
      });
      var shift = 0;
      if (ri === pos.r) {
        var n = r.tiles[pos.c].node, right = n.offsetLeft + n.offsetWidth + 96;
        if (right > 1920) shift = right - 1920;
      }
      r.strip.style.transform = 'translateX(' + (-shift) + 'px)';
    });
  }

  function launch(t) {
    var msg = document.getElementById('msg');
    msg.textContent = '';
    try {
      tizen.application.launch(t.appId, function () {}, function (e) { msg.textContent = t.label + ': ' + e.message; });
    } catch (e) { msg.textContent = t.label + ': ' + e.message; }
  }

  document.addEventListener('keydown', function (e) {
    var k = e.keyCode, row = rows[pos.r];
    if (k === 39) pos.c = Math.min(row.tiles.length - 1, pos.c + 1);
    else if (k === 37) pos.c = Math.max(0, pos.c - 1);
    else if (k === 40 && pos.r < rows.length - 1) { pos.r++; pos.c = Math.min(pos.c, rows[pos.r].tiles.length - 1); }
    else if (k === 38 && pos.r > 0) { pos.r--; pos.c = Math.min(pos.c, rows[pos.r].tiles.length - 1); }
    else if (k === 13) { launch(rows[pos.r].tiles[pos.c].cfg); return; }
    else if (k === 10009 && window.tizen) { tizen.application.getCurrentApplication().exit(); return; }
    focus();
  });

  // New random background every time the hub is opened (never the same one twice in a row).
  function pickBackground() {
    if (!cfg.photos || !cfg.photos.length) return;
    var last = Number(localStorage.getItem('lastBg') || -1), i;
    do { i = Math.floor(Math.random() * cfg.photos.length); } while (cfg.photos.length > 1 && i === last);
    localStorage.setItem('lastBg', i);
    var l = document.getElementById('p1');
    l.style.backgroundImage = 'url(' + cfg.photos[i] + ')';
    l.className = 'photo on';
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && cfg) pickBackground(); });

  // Use the icon the TV already has for each app; keep the styled fallback if it can't be read.
  function loadIcons() {
    rows.forEach(function (r) {
      r.tiles.forEach(function (t) {
        if (!window.tizen || t.cfg.glyph === 'tv') return;
        try {
          tizen.application.getAppInfo(t.cfg.appId, function (info) {
            if (!info.iconPath) return;
            var img = new Image();
            img.onload = function () {
              t.node.className += ' has-icon';
              img.className = 'icon';
              t.node.appendChild(img);
            };
            img.src = info.iconPath;
          }, function () {});
        } catch (e) {}
      });
    });
  }

  var x = new XMLHttpRequest();
  x.open('GET', 'config.json', true);
  x.onload = function () {
    cfg = JSON.parse(x.responseText);
    tick(); setInterval(tick, 10000);
    build(); pickBackground(); loadIcons();
  };
  x.send();
</script>
</body>
</html>

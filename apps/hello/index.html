<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Hello</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  h1 { font-size: 96px; margin: 0; }
  #key { font-size: 40px; margin-top: 40px; color: #8cf; }
</style>
</head>
<body>
<h1>Hello TV</h1>
<div id="key">Press a remote key</div>
<script>
  document.addEventListener('keydown', function (e) {
    document.getElementById('key').textContent = 'keyCode: ' + e.keyCode;
    if (e.keyCode === 10009 && window.tizen) tizen.application.getCurrentApplication().exit();
  });
</script>
</body>
</html>
